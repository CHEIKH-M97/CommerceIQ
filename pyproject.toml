[project]
name = "commerceiq"
version = "0.1.0"
description = "Business Intelligence platform for large-scale e-commerce analytics."
readme = "README.md"
authors = [
    { name = "CHEIKH-M97", email = "yessin.cheikhrouhou05@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "plotly>=6.9.0",
    "polars>=1.43.2",
    "streamlit>=1.60.0",
]

[project.scripts]
commerceiq = "commerceiq.cli.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
